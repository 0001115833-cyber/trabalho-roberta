name: CI-Qualidade

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar pasta src
        run: |
          if [ ! -d src ]; then
            echo "Pasta src não encontrada"
            exit 1
          fi

      - name: Verificar CSS
        run: |
          if [ ! -f src/css/style.css ]; then
            echo "CSS não encontrado"
            exit 1
          fi

      - name: Instalar HTMLHint
        run: npm install -g htmlhint

      - name: Lint HTML
        run: htmlhint src/index.html

      - name: Verificar footer obrigatório
        run: |
          if ! grep -qi "Roberta Ferreira Antunes" src/index.html; then
            echo "Footer obrigatório ausente"
            exit 1
          fi

      - name: Mensagem final
        run: echo "O código do aluno Roberta Ferreira Antunes foi auditado, está seguindo as normas corretas e está pronto para o deploy!"
